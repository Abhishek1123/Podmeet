<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="acidSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9e21b"/>
      <stop offset="60%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#f0391e"/>
    </linearGradient>
    <linearGradient id="chiliGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0391e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c9e21b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="#070707"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="#111110" stroke="url(#acidSun)" stroke-width="3"/>

  <!-- Ambient background flame glow -->
  <circle cx="64" cy="74" r="38" fill="url(#chiliGlow)"/>

  <!-- Hot chili flame accent behind mic -->
  <path d="M64 20 C72 34 84 46 80 62 C77 72 70 78 64 80 C58 78 51 72 48 62 C44 46 56 34 64 20 Z" fill="#f0391e" opacity="0.35"/>

  <!-- Studio Microphone Capsule -->
  <rect x="52" y="32" width="24" height="42" rx="12" fill="url(#acidSun)" filter="url(#glow)"/>

  <!-- Inner capsule grill lines -->
  <line x1="56" y1="44" x2="72" y2="44" stroke="#070707" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="56" y1="52" x2="72" y2="52" stroke="#070707" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="56" y1="60" x2="72" y2="60" stroke="#070707" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Mic U-shaped frame -->
  <path d="M44 54 C44 70 52 78 64 78 C76 78 84 70 84 54" fill="none" stroke="#f4f4ef" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Mic Stand & Base -->
  <line x1="64" y1="78" x2="64" y2="96" stroke="#f4f4ef" stroke-width="5" stroke-linecap="round"/>
  <line x1="48" y1="96" x2="80" y2="96" stroke="#c9e21b" stroke-width="5" stroke-linecap="round"/>

  <!-- Sound wave sparks -->
  <path d="M34 52 C31 58 31 66 34 72" fill="none" stroke="#c9e21b" stroke-width="3" stroke-linecap="round"/>
  <path d="M94 52 C97 58 97 66 94 72" fill="none" stroke="#f0391e" stroke-width="3" stroke-linecap="round"/>
</svg>

